<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Management Portal | British Midland Virtual</title>

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="management.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body>

    <main class="login-page">

        <section class="login-panel">

            <div class="brand">

                <div class="brand-mark">
                    BM
                </div>

                <div class="brand-copy">
                    <span>BRITISH MIDLAND VIRTUAL</span>
                    <small>OPERATIONS CONTROL</small>
                </div>

            </div>


            <div class="login-content">

                <div class="login-heading">

                    <span class="eyebrow">
                        MANAGEMENT PORTAL
                    </span>

                    <h1>
                        Welcome back.
                    </h1>

                    <p>
                        Sign in to British Midland Virtual
                        Operations Control.
                    </p>

                </div>


                <form id="loginForm">

                    <div class="field">

                        <label for="pilotId">
                            PILOT ID
                        </label>

                        <input
                            id="pilotId"
                            type="text"
                            autocomplete="username"
                            placeholder="BMA0001"
                            maxlength="7"
                            spellcheck="false"
                            autocapitalize="characters"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="password">
                            PASSWORD
                        </label>

                        <input
                            id="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Password"
                            required
                        >

                    </div>


                    <button
                        id="loginButton"
                        type="submit"
                    >
                        SIGN IN
                    </button>


                    <div
                        id="loginMessage"
                        class="login-message"
                        aria-live="polite"
                    ></div>

                </form>

            </div>


            <footer>

                <span>
                    RESTRICTED ACCESS
                </span>

                <span>
                    BRITISH MIDLAND VIRTUAL
                </span>

            </footer>

        </section>


        <section class="visual-panel">

            <div class="visual-overlay"></div>

            <div class="visual-content">

                <span class="visual-kicker">
                    OPERATIONS CONTROL
                </span>

                <h2>
                    The Heart<br>
                    of the Operation.
                </h2>

                <p>
                    Flight operations, pilot performance
                    and ACARS reporting.
                </p>

            </div>

        </section>

    </main>


    <script src="/management/management.js?v=9"></script>

</body>

</html>
